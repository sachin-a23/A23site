<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A23SITE ADMIN - Private Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .portal-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .portal-header h2 {
      color: #00ffcc;
      font-size: 22px;
      letter-spacing: 1px;
    }
    .portal-header span {
      color: #888;
      font-size: 14px;
      margin: 0 10px;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #131b2e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #1f2c48;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h3 {
      color: #00ffcc;
      font-size: 18px;
      margin-top: 0;
    }
    .sub-text {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 15px;
    }
    .market-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }
    .tag-btn {
      background: #1a233a;
      color: #94a3b8;
      border: 1px solid #2a3959;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    .tag-btn.active {
      background: #00ffcc;
      color: #0b0f19;
      border-color: #00ffcc;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
    textarea {
      width: 100%;
      height: 250px;
      background: #0b0f19;
      color: #00ffcc;
      border: 1px solid #1f2c48;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    button.action-btn {
      background: #1a233a;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button.action-btn.primary {
      background: #00ffcc;
      color: #0b0f19;
    }
    button.action-btn.github {
      background: #ff9900;
      color: #0b0f19;
      border-color: #ff9900;
      grid-column: span 2;
    }
    button.action-btn:hover {
      opacity: 0.9;
    }
    #saveStatus {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
    }
    .footer {
      text-align: center;
      margin-top: 25px;
      color: #64748b;
      font-size: 12px;
    }
    .footer a {
      color: #00ffcc;
      text-decoration: none;
      margin: 0 8px;
    }
  </style>
</head>
<body>

  <div class="portal-header">
    <h2>🟢 A23SITE ADMIN <span>Portal Home</span> <span style="color:#00ffcc;">🔒 Private Panel</span></h2>
  </div>

  <div class="container">
    <h3>PRIVATE CONTROL PANEL</h3>
    <div class="sub-text">Ye section poori tarah se private hai. Aap yahan apna sara market record manage kar sakte hain. (Format line: DD-MM-YYYY / Result)</div>

    <div style="font-weight: bold; margin-bottom: 10px; color: #00ffcc;">📈 Market & Kalyan Tracker Data</div>
    
    <!-- Market Selection Tabs -->
    <div class="market-tabs">
      <button class="tag-btn active" onclick="switchMarket('sridevi', event)">SHRIDEVI</button>
      <button class="tag-btn" onclick="switchMarket('timebazaar', event)">TIMEBAZAAR</button>
      <button class="tag-btn" onclick="switchMarket('milan', event)">MILAN</button>
      <button class="tag-btn" onclick="switchMarket('kalyan', event)">KALYAN</button>
      <button class="tag-btn" onclick="switchMarket('other', event)">OTHER</button>
    </div>

    <label id="currentMarketLabel">Apna private analysis aur track records yahan likhein (SHRIDEVI):</label>
    
    <!-- Data Input Textarea -->
    <textarea id="marketDataInput" placeholder="Jaise enter karein:&#10;28-07-2026 / 120-38-189&#10;29-07-2026 / 567-88-234" disabled></textarea>
    
    <div class="btn-grid">
      <button class="action-btn primary" onclick="toggleEdit()">🔓 Unlock to Edit</button>
      <button class="action-btn" onclick="saveMarketData()">💾 Save Record</button>
      <button class="action-btn" onclick="copyData()">📋 Copy Data</button>
      <button class="action-btn" onclick="exportForApp()">📦 Export for App</button>
      <button class="action-btn" onclick="resetGitHubToken()" style="background: #2a3959; color: #ff9900; border-color: #ff9900;">🔑 Reset Token</button>
      <button class="action-btn github" onclick="syncToGitHub()">🚀 Sync to GitHub (Direct)</button>
    </div>

    <div id="saveStatus"></div>
  </div>

  <div class="footer">
    © 2026 A23SITE • All rights reserved<br>
    <a href="#">Telegram</a> <a href="#">WhatsApp</a>
  </div>

  <script>
    let activeMarket = 'sridevi';
    let isEditable = false;

    const GITHUB_USERNAME = "sachin-a23";
    const REPO_NAME = "A23site";
    const FILE_PATH = "data.json";

    function getGitHubToken() {
      let token = localStorage.getItem('a23_github_token');
      if (!token) {
        token = prompt("Apna GitHub Personal Access Token yahan enter karein (Yeh sirf aapke phone me secure rahega):");
        if (token) {
          localStorage.setItem('a23_github_token', token.trim());
        }
      }
      return token;
    }

    function resetGitHubToken() {
      localStorage.removeItem('a23_github_token');
      let newToken = prompt("Naya GitHub Personal Access Token yahan enter karein:");
      if (newToken) {
        localStorage.setItem('a23_github_token', newToken.trim());
        let status = document.getElementById('saveStatus');
        status.style.color = '#00ffcc';
        status.innerText = '✓ Token successfully updated!';
        setTimeout(() => { status.innerText = ''; }, 3000);
      }
    }

    function switchMarket(market, event) {
      activeMarket = market;
      
      let buttons = document.querySelectorAll('.tag-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('currentMarketLabel').innerText = `Apna private analysis aur track records yahan likhein (${market.toUpperCase() === 'SRIDEVI' ? 'SHRIDEVI' : market.toUpperCase()}):`;
      
      let savedData = localStorage.getItem('a23_market_' + activeMarket) || '';
      document.getElementById('marketDataInput').value = savedData;
      document.getElementById('marketDataInput').disabled = true;
      isEditable = false;
      document.querySelector('button.action-btn.primary').innerText = '🔓 Unlock to Edit';
      document.getElementById('saveStatus').innerText = '';
    }

    function toggleEdit() {
      let textarea = document.getElementById('marketDataInput');
      let btn = document.querySelector('button.action-btn.primary');
      isEditable = !isEditable;
      textarea.disabled = !isEditable;
      if (isEditable) {
        textarea.focus();
        btn.innerText = '🔒 Lock Editing';
      } else {
        btn.innerText = '🔓 Unlock to Edit';
      }
    }

    function saveMarketData() {
      let data = document.getElementById('marketDataInput').value;
      localStorage.setItem('a23_market_' + activeMarket, data);
      
      let status = document.getElementById('saveStatus');
      status.style.color = '#00ffcc';
      status.innerText = '✓ Saved locally!';
      setTimeout(() => { status.innerText = ''; }, 3000);
    }

    function copyData() {
      let textarea = document.getElementById('marketDataInput');
      textarea.select();
      document.execCommand('copy');
      let status = document.getElementById('saveStatus');
      status.style.color = '#00ffcc';
      status.innerText = '✓ Copied to clipboard!';
      setTimeout(() => { status.innerText = ''; }, 3000);
    }

    function buildAppPayload() {
      const marketKeys = ["sridevi", "timebazaar", "milan", "kalyan", "other"];
      let recordsArray = [];

      marketKeys.forEach(mKey => {
        let rawText = localStorage.getItem('a23_market_' + mKey) || "";
        if (rawText.trim() !== "") {
          let lines = rawText.split('\n');
          lines.forEach(line => {
            let parts = line.split('/');
            if (parts.length >= 2) {
              let dateStr = parts[0].trim();
              let resStr = parts[1].trim();
              if (dateStr && resStr) {
                let formattedMarketName = mKey.toUpperCase();
                
                if (formattedMarketName === "SRIDEVI") {
                  formattedMarketName = "SHRIDEVI";
                }
                if (formattedMarketName === "TIMEBAZAAR") {
                  formattedMarketName = "TIME BAZAR";
                }
                
                recordsArray.push({
                  marketName: formattedMarketName,
                  date: dateStr,
                  result: resStr,
                  isHoliday: resStr.includes("***") || resStr.toLowerCase().includes("holiday")
                });
              }
            }
          });
        }
      });

      return {
        version: "1.0",
        last_updated: new Date().toLocaleString(),
        markets: ["SHRIDEVI", "KALYAN", "MILAN", "TIME BAZAR", "OTHER"],
        records: recordsArray
      };
    }

    function exportForApp() {
      const appPayload = buildAppPayload();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appPayload, null, 2));
      let downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();

      let status = document.getElementById('saveStatus');
      status.style.color = '#00ffcc';
      status.innerText = '✓ Downloaded data.json!';
      setTimeout(() => { status.innerText = ''; }, 3000);
    }

    async function syncToGitHub() {
      const GITHUB_TOKEN = getGitHubToken();
      if (!GITHUB_TOKEN) {
        alert("GitHub Token zaroori hai!");
        return;
      }

      let status = document.getElementById('saveStatus');
      status.style.color = '#ff9900';
      status.innerText = '⏳ Syncing with GitHub...';

      const appPayload = buildAppPayload();
      const jsonString = JSON.stringify(appPayload, null, 2);
      const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

      try {
        const getUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
        
        let fileSha = "";
        const getResponse = await fetch(getUrl, {
          headers: { 
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });
        
        if (getResponse.ok) {
          const fileData = await getResponse.json();
          fileSha = fileData.sha;
        }

        const putResponse = await fetch(getUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/vnd.github.v3+json"
          },
          body: JSON.stringify({
            message: "Update market records via A23 PRO Admin Panel",
            content: contentEncoded,
            ...(fileSha ? { sha: fileSha } : {})
          })
        });

        if (putResponse.ok) {
          status.style.color = '#00ffcc';
          status.innerText = '✓ Successfully synced to GitHub!';
        } else {
          const errData = await putResponse.json();
          status.style.color = '#ff4444';
          status.innerText = '❌ Error: ' + (errData.message || "Push failed");
        }
      } catch (error) {
        status.style.color = '#ff4444';
        status.innerText = '❌ Network Error!';
        console.error(error);
      }

      setTimeout(() => { status.innerText = ''; }, 4000);
    }

    window.onload = function() {
      let savedData = localStorage.getItem('a23_market_sridevi') || '';
      document.getElementById('marketDataInput').value = savedData;
    };
  </script>
</body>
</html>
