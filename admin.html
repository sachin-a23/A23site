<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A23 PRO - Admin Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      color: #00ffcc;
    }
    .market-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }
    .tag-btn {
      background: #2d2d2d;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .tag-btn.active {
      background: #00ffcc;
      color: #121212;
      font-weight: bold;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #bbb;
    }
    textarea {
      width: 100%;
      height: 250px;
      background: #2d2d2d;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button.action-btn {
      flex: 1;
      background: #00ffcc;
      color: #121212;
      border: none;
      padding: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }
    button.action-btn:hover {
      background: #00cca3;
    }
    #saveStatus {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>A23 PRO Admin Panel</h2>
    
    <!-- Market Selection Tabs -->
    <div class="market-tabs">
      <button class="tag-btn active" onclick="switchMarket('sridevi', event)">Sridevi</button>
      <button class="tag-btn" onclick="switchMarket('timebazaar', event)">Time Bazar</button>
      <button class="tag-btn" onclick="switchMarket('milan', event)">Milan</button>
      <button class="tag-btn" onclick="switchMarket('kalyan', event)">Kalyan</button>
      <button class="tag-btn" onclick="switchMarket('other', event)">Other</button>
    </div>

    <label id="currentMarketLabel">Apna private analysis aur track records yahan likhein (SRIDEVI):</label>
    
    <!-- Data Input Textarea -->
    <textarea id="marketDataInput" placeholder="Yahan data enter karein..."></textarea>
    
    <div class="btn-container">
      <button class="action-btn" onclick="saveMarketData()">💾 Save Locally</button>
      <button class="action-btn" style="background: #ff9900;" onclick="exportToJsonFile()">🚀 Sync to GitHub</button>
    </div>

    <div id="saveStatus"></div>
  </div>

  <script>
    let activeMarket = 'sridevi';

    const GITHUB_USERNAME = "sachin-a23";
    const REPO_NAME = "A23site";
    const FILE_PATH = "data.json";

    // Token ko secure tarike se browser ke localStorage se lena
    function getGitHubToken() {
      let token = localStorage.getItem('a23_github_token');
      if (!token) {
        token = prompt("Apna GitHub Personal Access Token yahan enter karein (Yeh sirf aapke phone me secure rahega):");
        if (token) {
          localStorage.setItem('a23_github_token', token.trim());
        }
      }
      return token;
    }

    function switchMarket(market, event) {
      activeMarket = market;
      
      let buttons = document.querySelectorAll('.tag-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('currentMarketLabel').innerText = `Apna private analysis aur track records yahan likhein (${market.toUpperCase()}):`;
      
      let savedData = localStorage.getItem('a23_market_' + activeMarket) || '';
      document.getElementById('marketDataInput').value = savedData;
      document.getElementById('saveStatus').innerText = '';
    }

    function saveMarketData() {
      let data = document.getElementById('marketDataInput').value;
      localStorage.setItem('a23_market_' + activeMarket, data);
      
      let status = document.getElementById('saveStatus');
      status.style.color = '#00ffcc';
      status.innerText = '✓ Saved locally!';
      setTimeout(() => { status.innerText = ''; }, 3000);
    }

    // GitHub par seedha sync karne ka function
    async function exportToJsonFile() {
      const GITHUB_TOKEN = getGitHubToken();
      if (!GITHUB_TOKEN) {
        alert("GitHub Token zaroori hai!");
        return;
      }

      let status = document.getElementById('saveStatus');
      status.style.color = '#ff9900';
      status.innerText = '⏳ Syncing with GitHub...';

      // Saare markets ka data object banana
      const allData = {
        "sridevi": localStorage.getItem('a23_market_sridevi') || "",
        "timebazaar": localStorage.getItem('a23_market_timebazaar') || "",
        "milan": localStorage.getItem('a23_market_milan') || "",
        "kalyan": localStorage.getItem('a23_market_kalyan') || "",
        "other": localStorage.getItem('a23_market_other') || "",
        "last_updated": new Date().toISOString()
      };

      const jsonString = JSON.stringify(allData, null, 2);
      const contentEncoded = btoa(unescape(encodeURIComponent(jsonString))); // Base64 encoding for GitHub API

      try {
        const getUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
        
        let fileSha = "";
        const getResponse = await fetch(getUrl, {
          headers: { "Authorization": `token ${GITHUB_TOKEN}` }
        });
        
        if (getResponse.ok) {
          const fileData = await getResponse.json();
          fileSha = fileData.sha;
        }

        const putResponse = await fetch(getUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Update market data via Admin Panel",
            content: contentEncoded,
            sha: fileSha
          })
        });

        if (putResponse.ok) {
          status.style.color = '#00ffcc';
          status.innerText = '✓ Successfully synced to GitHub!';
        } else {
          const errData = await putResponse.json();
          status.style.color = '#ff4444';
          status.innerText = '❌ Error: ' + errData.message;
        }
      } catch (error) {
        status.style.color = '#ff4444';
        status.innerText = '❌ Network Error!';
        console.error(error);
      }

      setTimeout(() => { status.innerText = ''; }, 4000);
    }

    window.onload = function() {
      let savedData = localStorage.getItem('a23_market_sridevi') || '';
      document.getElementById('marketDataInput').value = savedData;
    };
  </script>
</body>
</html>
